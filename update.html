<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>12. ຫ້ອງອັບເດດຂໍ້ມູນລະບົບໂຮງຮຽນ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Lao', sans-serif; }
        html, body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-width: 0;
            flex: 1 1 auto;
        }
        .back-btn {
            background: #334155;
            color: #f8fafc;
            text-decoration: none;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .back-btn:hover { background: #475569; }
        .page-title {
            font-size: clamp(15px, 2.2vw, 18px);
            font-weight: 700;
            color: #38bdf8;
            line-height: 1.35;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .user-pill {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            min-width: 0;
        }
        .user-pill > span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }
        .role-tag {
            background: #16a34a;
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 20px auto 32px;
            padding: 0 14px;
            min-width: 0;
        }

        .submenus {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .submenu-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 11px 13px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            line-height: 1.35;
            min-width: 0;
            overflow-wrap: anywhere;
            transition: 0.2s;
        }
        .submenu-btn:hover { border-color: #38bdf8; color: #fff; }
        .submenu-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border-color: #7dd3fc;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
        }

        .score-sub-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .score-sub-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 7px 13px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            flex: 1 1 150px;
            text-align: center;
        }
        .score-sub-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #fff;
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.3);
            min-width: 0;
        }

        .panel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #334155;
        }
        .panel-top h2 {
            font-size: clamp(15px, 2vw, 18px);
            color: #f8fafc;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .sync-note {
            font-size: 12px;
            color: #86efac;
            background: rgba(22, 163, 74, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            padding: 5px 10px;
            border-radius: 8px;
            line-height: 1.35;
            max-width: 100%;
        }

        .form-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 18px;
            min-width: 0;
        }
        .form-card h3 {
            font-size: 14.5px;
            color: #7dd3fc;
            margin-bottom: 12px;
            line-height: 1.35;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px;
        }
        .form-group { min-width: 0; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            min-width: 0;
            padding: 9px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f8fafc;
            font-size: 13px;
        }
        .form-group input[readonly] {
            background: #0b1220;
            color: #38bdf8;
            font-weight: 700;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .form-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .btn:hover { background: #334155; }
        .btn-save { background: #16a34a; border-color: #22c55e; color: #fff; }
        .btn-save:hover { background: #15803d; }
        .btn-edit { background: #eab308; border-color: #facc15; color: #0f172a; padding: 5px 10px; font-size: 12px; }
        .btn-del { background: #dc2626; border-color: #ef4444; color: #fff; padding: 5px 10px; font-size: 12px; }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 9px 11px;
            text-align: left;
            font-size: 13px;
            line-height: 1.35;
            vertical-align: middle;
        }
        th { background: #0f172a; color: #93c5fd; font-weight: 700; white-space: nowrap; }
        td { background: #162032; overflow-wrap: anywhere; }
        td:last-child { white-space: nowrap; }
        .empty-row { text-align: center; color: #94a3b8; padding: 16px; white-space: normal; }

        .denied-box {
            max-width: 560px;
            margin: 48px 16px;
            background: #1e293b;
            border: 1px solid #ef4444;
            border-radius: 16px;
            padding: 24px 18px;
            text-align: center;
        }
        @media (min-width: 600px) {
            .denied-box { margin: 60px auto; padding: 28px; }
        }
        .denied-box h2 { color: #f87171; margin-bottom: 10px; font-size: clamp(17px, 3vw, 22px); }
        .denied-box p { color: #cbd5e1; margin-bottom: 18px; font-size: 14px; line-height: 1.5; }

        /* ເຊື່ອງ badge / ປ້າຍສະຖານະ Firebase */
        #fbSyncBadge,
        .badge-fb,
        [data-hide-firebase="true"],
        [class*="firebase" i],
        [id*="firebase" i] {
            display: none !important;
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <a href="index.html" class="back-btn">← ກັບໜ້າຫຼັກ</a>
        <div class="page-title">🛠️ 12. ຫ້ອງອັບເດດຂໍ້ມູນລະບົບ</div>
    </div>
    <div class="user-pill">
        <span>👤 <strong id="upd-user-name">ຜູ້ໃຊ້ງານ</strong></span>
        <span class="role-tag" id="upd-user-role">ADMIN</span>
    </div>
</header>

<div id="access-denied" class="denied-box" style="display:none;">
    <h2>⛔ ບໍ່ມີສິດເຂົ້າໃຊ້ຫ້ອງອັບເດດ</h2>
    <p>ຈຳກັດສິດສຳລັບນັກຮຽນ.</p>
    <a href="index.html" class="btn btn-save" style="text-decoration:none;display:inline-block;">ກັບໄປໜ້າຫຼັກ</a>
</div>

<div class="container" id="update-main-container">
    <div class="submenus">
        <button type="button" class="submenu-btn active" data-tab="rooms" onclick="switchUpdateTab('rooms')">🏫 1. ລາຍຊື່ຫ້ອງ</button>
        <button type="button" class="submenu-btn" data-tab="teachers" onclick="switchUpdateTab('teachers')">👩‍🏫 2. ລາຍຊື່ຄູ</button>
        <button type="button" class="submenu-btn" data-tab="students" onclick="switchUpdateTab('students')">🎓 3. ລາຍຊື່ນັກຮຽນ</button>
        <button type="button" class="submenu-btn" data-tab="schedules" onclick="switchUpdateTab('schedules')">📅 4. ຕາຕະລາງສອນ (ວັນ-ອາທິດ)</button>
        <button type="button" class="submenu-btn" data-tab="scores" onclick="switchUpdateTab('scores')">📊 5. ຄະແນນນັກຮຽນ</button>
        <button type="button" class="submenu-btn" data-tab="tuition" onclick="switchUpdateTab('tuition')">💰 6. ລາຍການຄ່າຮຽນ</button>
        <button type="button" class="submenu-btn" data-tab="subjects" onclick="switchUpdateTab('subjects')">📚 7. ວິຊາຮຽນ</button>
        <button type="button" class="submenu-btn admin-only-tab" id="btn-tab-terms" data-tab="terms" onclick="switchUpdateTab('terms')">🗓️ 8. ຈັດການເທີມຮຽນ</button>
    </div>

    <section class="panel">
        <div class="panel-top">
            <h2 id="active-tab-title">🏫 ເພີ່ມ / ແກ້ໄຂ / ລົບ ລາຍຊື່ຫ້ອງ</h2>
            <span class="sync-note">⚡ ກັ່ນຕອງໂຕບໍ່ຊ້ຳກັນ &amp; ຊິ້ງໄປທຸກໜ້າໃນລະບົບ</span>
        </div>

        <div class="form-card">
            <div id="score-sub-bar" class="score-sub-bar" style="display:none;">
                <button type="button" class="score-sub-btn active" id="score-sub-btn-subject" onclick="switchScoreSubMode('subject')">
                    1. ຄະແນນລາຍວິຊາ
                </button>
                <button type="button" class="score-sub-btn" id="score-sub-btn-annual" onclick="switchScoreSubMode('annual')">
                    2. ຄະແນນສະເລ່ຍໝົດປີ

            </div>

            <h3 id="form-heading">➕ ເພີ່ມຂໍ້ມູນໃໝ່</h3>
            <form id="dynamic-crud-form">
                <div class="form-grid" id="dynamic-fields"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-save" id="btn-submit-record">💾 ບັນທຶກ</button>
                    <button type="button" class="btn" id="btn-cancel-edit" style="display:none;" onclick="resetEditMode()">↩ ຍົກເລີກການແກ້ໄຂ</button>
                </div>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead id="dynamic-thead"></thead>
                <tbody id="dynamic-tbody"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
(function () {
    const STYLE_ID = "js-responsive-update-style";

    function buildUpdateResponsiveCss(width, isLandscape) {
        const isTinyMobile = width <= 360;
        const isSmallMobile = width <= 480;
        const isMobile = width <= 768;
        const isTablet = width <= 1024;
        const isWide = width >= 1440;

        const containerMaxWidth = isWide ? "1400px" : "1280px";
        const containerPadding = isTinyMobile
            ? "0 8px 20px"
            : isSmallMobile
            ? "0 10px 24px"
            : isMobile
            ? "0 12px 28px"
            : "0 16px 32px";
        const containerMargin = isMobile ? "12px auto" : "24px auto";
        const panelPadding = isTinyMobile ? "10px" : isSmallMobile ? "12px" : isTablet ? "16px" : "20px";
        const formCardPadding = isTinyMobile ? "10px" : isSmallMobile ? "12px" : "16px";
        const titleSize = isTinyMobile ? "14px" : isSmallMobile ? "15px" : isTablet ? "16.5px" : "18px";
        const submenuCols = isTinyMobile
            ? "1fr"
            : isSmallMobile
            ? "repeat(2, minmax(0, 1fr))"
            : isMobile && isLandscape
            ? "repeat(4, minmax(0, 1fr))"
            : isMobile
            ? "repeat(2, minmax(0, 1fr))"
            : isTablet
            ? "repeat(3, minmax(0, 1fr))"
            : "repeat(auto-fit, minmax(175px, 1fr))";
        const formCols = isMobile && !isLandscape
            ? "1fr"
            : isMobile && isLandscape
            ? "repeat(2, minmax(0, 1fr))"
            : isTablet
            ? "repeat(2, minmax(0, 1fr))"
            : "repeat(auto-fit, minmax(190px, 1fr))";
        const minTableWidth = isTinyMobile ? "520px" : isSmallMobile ? "580px" : isMobile ? "660px" : "760px";

        return `
            html, body {
                max-width: 100% !important;
                overflow-x: hidden !important;
            }
            .container, .panel, .form-card, .table-wrap, .submenus, .form-grid {
                min-width: 0 !important;
            }
            .topbar {
                padding: ${isTinyMobile ? "8px 10px" : isSmallMobile ? "10px 12px" : "12px 16px"} !important;
                gap: ${isTinyMobile ? "7px" : "10px"} !important;
            }
            .page-title {
                font-size: ${titleSize} !important;
            }
            .container {
                max-width: ${containerMaxWidth} !important;
                margin: ${containerMargin} !important;
                padding: ${containerPadding} !important;
            }
            .submenus {
                display: grid !important;
                grid-template-columns: ${submenuCols} !important;
                gap: ${isTinyMobile ? "6px" : isSmallMobile ? "8px" : "10px"} !important;
                margin-bottom: ${isMobile ? "12px" : "18px"} !important;
            }
            .submenu-btn {
                padding: ${isTinyMobile ? "8px 9px" : isSmallMobile ? "9px 10px" : "11px 13px"} !important;
                font-size: ${isTinyMobile ? "11.5px" : isSmallMobile ? "12px" : "13px"} !important;
                border-radius: ${isSmallMobile ? "9px" : "12px"} !important;
            }
            .panel {
                padding: ${panelPadding} !important;
                border-radius: ${isSmallMobile ? "12px" : "16px"} !important;
            }
            .panel-top h2 {
                font-size: ${titleSize} !important;
            }
            .form-card {
                padding: ${formCardPadding} !important;
                border-radius: ${isSmallMobile ? "10px" : "12px"} !important;
            }
            .form-grid {
                display: grid !important;
                grid-template-columns: ${formCols} !important;
                gap: ${isTinyMobile ? "7px" : isSmallMobile ? "8px" : "10px"} !important;
            }
            .form-group input,
            .form-group select {
                padding: ${isTinyMobile ? "7px 8px" : isSmallMobile ? "8px 9px" : "9px 10px"} !important;
                font-size: ${isSmallMobile ? "12.5px" : "13px"} !important;
            }
            .table-wrap {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch !important;
                width: 100% !important;
            }
            table {
                min-width: ${minTableWidth} !important;
            }
            ${isMobile ? `
                .topbar {
                    flex-direction: column !important;
                    align-items: stretch !important;
                }
                .topbar-left {
                    width: 100% !important;
                    justify-content: flex-start !important;
                }
                .user-pill {
                    width: 100% !important;
                    justify-content: space-between !important;
                    border-radius: 10px !important;
                    padding: 5px 10px !important;
                    font-size: 12px !important;
                }
                .user-pill > span:first-child {
                    max-width: ${isTinyMobile ? "170px" : "230px"} !important;
                }
                .back-btn {
                    padding: ${isTinyMobile ? "6px 10px" : "7px 12px"} !important;
                    font-size: ${isTinyMobile ? "12px" : "13px"} !important;
                }
                .sync-note {
                    width: 100% !important;
                    font-size: 11.5px !important;
                }
                .form-actions {
                    flex-direction: column !important;
                }
                .form-actions .btn {
                    width: 100% !important;
                    text-align: center !important;
                    padding: 9px 12px !important;
                }
                th, td {
                    padding: ${isTinyMobile ? "7px 8px" : "8px 9px"} !important;
                    font-size: ${isTinyMobile ? "11.5px" : "12px"} !important;
                }
                .btn-edit, .btn-del {
                    padding: 4px 8px !important;
                    font-size: 11px !important;
                }
            ` : ""}
        `;
    }

    function applyUpdateResponsiveLayout() {
        const width = window.innerWidth || document.documentElement.clientWidth || 1024;
        const height = window.innerHeight || document.documentElement.clientHeight || 768;
        const isLandscape = width > height;

        document.documentElement.dataset.screenMode =
            width <= 360 ? "mobile-xxs" :
            width <= 480 ? "mobile-xs" :
            width <= 768 ? "mobile" :
            width <= 1024 ? "tablet" :
            width >= 1440 ? "desktop-xl" : "desktop";

        let styleEl = document.getElementById(STYLE_ID);
        if (!styleEl) {
            styleEl = document.createElement("style");
            styleEl.id = STYLE_ID;
            document.head.appendChild(styleEl);
        }
        styleEl.textContent = buildUpdateResponsiveCss(width, isLandscape);
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(applyUpdateResponsiveLayout, 80);
    });
    window.addEventListener("orientationchange", () => {
        setTimeout(applyUpdateResponsiveLayout, 120);
    });
    document.addEventListener("DOMContentLoaded", applyUpdateResponsiveLayout);
    applyUpdateResponsiveLayout();
})();
</script>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore, collection, getDocs, addDoc, setDoc, deleteDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {

        authDomain: "my-school-c1104.firebaseapp.com",
        projectId: "my-school-c1104",
        storageBucket: "my-school-c1104.appspot.com",
        messagingSenderId: "339930418459",

        measurementId: "G-NPNFSW2C72"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DAYS_ORDER = ["ຈັນ", "ອັງຄານ", "ພຸດ", "ພະຫັດ", "ສຸກ", "ເສົາ", "ອາທິດ"];
    const MONTHS_ORDER = [
        "ມັງກອນ", "ກຸມພາ", "ມີນາ", "ເມສາ", "ພຶດສະພາ", "ມິຖຸນາ",
        "ກໍລະກົດ", "ສິງຫາ", "ກັນຍາ", "ຕຸລາ", "ພະຈິກ", "ທັນວາ"
    ];
    const DEFAULT_SUBJECTS = ["ຄະນິດສາດ", "ຟີຊິກສາດ", "ເຄມີສາດ", "ຊີວະສາດ", "ພາສາລາວ", "ພາສາອັງກິດ", "ໄອທີ / ຄອມ"];
    let availableSubjects = [...DEFAULT_SUBJECTS];

    function cleanVal(v) {
        return String(v ?? "").trim().replace(/^["']+|["']+$/g, "");
    }
    function cleanGrade(v) {
        return cleanVal(v).replace(/\s+/g, "");
    }
    function cleanDay(v) {
        const base = cleanVal(v)
            .replace(/^ວັນ/i, "")
            .replace(/^ມື້/i, "")
            .trim();
        const lower = base.toLowerCase();

        if (["ຈັນ", "mon", "monday"].includes(lower)) return "ຈັນ";
        if (["ອັງຄານ", "ຄານ", "ຄາມ", "tue", "tuesday"].includes(lower)) return "ອັງຄານ";
        if (["ພຸດ", "wed", "wednesday"].includes(lower)) return "ພຸດ";
        if (["ພະຫັດ", "ພຶຫັດ", "thu", "thursday"].includes(lower)) return "ພະຫັດ";
        if (["ສຸກ", "fri", "friday"].includes(lower)) return "ສຸກ";
        if (["ເສົາ", "sat", "saturday"].includes(lower)) return "ເສົາ";
        if (["ອາທິດ", "sun", "sunday"].includes(lower)) return "ອາທິດ";
        return base;
    }
    function cleanMonth(v, fallback = "ກັນຍາ") {
        const cleaned = cleanVal(v).replace(/^ເດືອນ/i, "").trim();
        if (MONTHS_ORDER.includes(cleaned)) return cleaned;
        const num = parseInt(cleaned, 10);
        if (num >= 1 && num <= 12) return MONTHS_ORDER[num - 1];
        return fallback;
    }
    function boundNum(v, min, max, fallback = 0) {
        const n = Number(v);
        if (!Number.isFinite(n)) return fallback;
        return Math.max(min, Math.min(max, n));
    }
    function escapeHtml(str) {
        return String(str ?? "")
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function formatNum(v) {
        return Number(v || 0).toLocaleString("en-US");
    }

    function computeAnnualAverage(data) {
        const map = data.courseworkBySubject || {};
        const totals = availableSubjects.map((subj) => {
            const cw = map[subj] || data.coursework || {};
            return boundNum(cw.attendance, 0, 10, 8)
                + boundNum(cw.participation, 0, 10, 8)
                + boundNum(cw.homework, 0, 20, 15)
                + boundNum(cw.midterm, 0, 25, 18)
                + boundNum(cw.final, 0, 35, 25);
        });
        const avg = totals.reduce((a, b) => a + b, 0) / totals.length;
        return Number(avg.toFixed(1));
    }

    function getDedupKey(tabKey, item) {
        if (tabKey === "students") {
            const code = cleanVal(item.studentCode).toLowerCase();
            const nameGrade = `${cleanVal(item.name).replace(/\s+/g, " ").toLowerCase()}__${cleanGrade(item.grade).toLowerCase()}`;

        }

        }
        if (tabKey === "teachers") {

            const name = cleanVal(item.name).replace(/\s+/g, " ").toLowerCase();
            return code ? `code:${code}` : `teacher:${name}`;
        }
        if (tabKey === "subjects") {

        }
        if (tabKey === "schedules") {
            return `sched:${cleanVal(item.week).toLowerCase()}__${cleanDay(item.day).toLowerCase()}__${cleanVal(item.period)}__${cleanGrade(item.room).toLowerCase()}`;
        }

        }
        if (tabKey === "terms") {
            const g = (!cleanVal(item.grade) || cleanVal(item.grade).toUpperCase() === "ALL") ? "all" : cleanGrade(item.grade).toLowerCase();
            return `term:${cleanVal(item.academicYear).toLowerCase()}__${cleanVal(item.term).toLowerCase()}__${g}`;
        }
        return `id:${item._col}__${item.id}`;
    }

    function completenessScore(item) {
        return Object.values(item).filter((v) => v && typeof v !== "object" && cleanVal(v) !== "").length;
    }

    function dedupeRecords(tabKey, list = []) {
        const map = new Map();
        list.forEach((item) => {
            const key = getDedupKey(tabKey, item);
            const prev = map.get(key);
            if (!prev) {
                map.set(key, item);
            } else {
                const prevScore = completenessScore(prev);
                const nextScore = completenessScore(item);
                const prevTime = prev._raw?.updatedAt?.seconds || prev._raw?.createdAt?.seconds || 0;
                const nextTime = item._raw?.updatedAt?.seconds || item._raw?.createdAt?.seconds || 0;
                if (nextScore > prevScore || (nextScore === prevScore && nextTime >= prevTime)) {
                    map.set(key, { ...prev, ...item });
                } else {
                    map.set(key, { ...item, ...prev });
                }
            }
        });
        const deduped = Array.from(map.values());
        if (tabKey === "schedules") {
            deduped.sort((a, b) => {
                const ia = DAYS_ORDER.indexOf(cleanDay(a.day));
                const ib = DAYS_ORDER.indexOf(cleanDay(b.day));
                if (ia !== ib) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
                return (Number(a.period) || 0) - (Number(b.period) || 0);
            });
        }
        return deduped;
    }

    async function refreshSubjectsFromFirestore() {
        try {
            const snap = await getDocs(collection(db, "subjects"));
            if (!snap.empty) {
                const dbSubjs = snap.docs
                    .map((d) => cleanVal(d.data().name || d.data().subjectName || d.data().subject))
                    .filter(Boolean);
                if (dbSubjs.length) {
                    availableSubjects = Array.from(new Set([...DEFAULT_SUBJECTS, ...dbSubjs]));
                }
            }
        } catch (err) {
            console.warn(err);
        }
    }

    function applyTermsFormDefaults() {
        const yrEl = document.getElementById("fld-academicYear");
        const startEl = document.getElementById("fld-startMonth");
        const endEl = document.getElementById("fld-endMonth");
        const grEl = document.getElementById("fld-grade");
        const tpEl = document.getElementById("fld-totalPeriods");
        const msEl = document.getElementById("fld-maxScore");
        if (yrEl && !yrEl.value) yrEl.value = "2026-2027";
        if (startEl) startEl.value = "ກັນຍາ";
        if (endEl) endEl.value = "ມັງກອນ";
        if (grEl && !grEl.value) grEl.value = "ALL";
        if (tpEl && !tpEl.value) tpEl.value = "40";
        if (msEl && !msEl.value) msEl.value = "20";
    }

    function syncTermsCache(list) {
        try {
            const normalized = list.map((item) => ({
                id: item.id,
                firestoreId: item.id,
                term: item.term,
                academicYear: item.academicYear,
                startMonth: item.startMonth,
                endMonth: item.endMonth,
                termRange: `${item.startMonth} – ${item.endMonth}`,
                grade: item.grade,
                totalPeriods: Number(item.totalPeriods) || 40,
                maxScore: Number(item.maxScore) || 20
            }));
            localStorage.setItem("school_term_periods", JSON.stringify(normalized));
        } catch (e) {}
    }

    function getActiveFields() {
        const cfg = TAB_CONFIGS[currentTab];
        if (currentTab === "scores" && typeof cfg.getFields === "function") {
            return cfg.getFields(currentScoreSubMode);
        }
        return cfg.fields || [];
    }

    function broadcastSystemDataUpdated(tabKey) {
        const payload = JSON.stringify({
            tab: tabKey,
            updatedBy: userName,
            timestamp: Date.now()
        });
        localStorage.setItem("schoolSystemDataUpdated", payload);
        window.dispatchEvent(new CustomEvent("school-data-updated", { detail: JSON.parse(payload) }));
    }

    function bindTuitionAutoCalculation() {
        if (currentTab !== "tuition") return;
        const creditsEl = document.getElementById("fld-credits");
        const priceEl = document.getElementById("fld-pricePerCredit");
        const feeEl = document.getElementById("fld-tuitionFee");
        if (!creditsEl || !priceEl || !feeEl) return;

        const recalc = () => {
            const c = Math.max(0, Number(creditsEl.value) || 0);
            const p = Math.max(0, Number(priceEl.value) || 0);
            feeEl.value = c * p;
        };

        creditsEl.addEventListener("input", recalc);
        priceEl.addEventListener("input", recalc);
        recalc();
    }

    function renderFormFields() {
        const fields = getActiveFields();
        const container = document.getElementById("dynamic-fields");
        container.innerHTML = fields.map((f) => {
            if (f.type === "select") {
                const opts = (f.options || []).map((opt) =>
                    `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`
                ).join("");
                return `
                    <div class="form-group">
                        <label>${escapeHtml(f.label)}</label>
                        <select name="${escapeHtml(f.name)}" id="fld-${escapeHtml(f.name)}" ${f.required ? "required" : ""}>
                            ${opts}
                        </select>
                    </div>
                `;
            }
            const extraAttrs = [
                f.min !== undefined ? `min="${f.min}"` : "",
                f.max !== undefined ? `max="${f.max}"` : "",
                f.step !== undefined ? `step="${f.step}"` : "",
                f.readonly ? "readonly" : ""
            ].filter(Boolean).join(" ");

            return `
                <div class="form-group">
                    <label>${escapeHtml(f.label)}</label>
                    <input
                        type="${f.type}"
                        name="${escapeHtml(f.name)}"
                        id="fld-${escapeHtml(f.name)}"
                        placeholder="${escapeHtml(f.placeholder || "")}"
                        ${extraAttrs}
                        ${f.required ? "required" : ""}
                    >
                </div>
            `;
        }).join("");

        if (currentTab === "terms") {
            applyTermsFormDefaults();
        }

        if (currentTab === "tuition") {
            const termEl = document.getElementById("fld-term");
            const feeEl = document.getElementById("fld-tuitionFee");
            if (termEl && !termEl.value) termEl.value = "ເທີມ 1 / 2026-2027";
            if (feeEl && !feeEl.value) feeEl.value = "0";
            bindTuitionAutoCalculation();
        }
    }

        const thead = document.getElementById("dynamic-thead");

            <tr>
                <th>ລ/ດ</th>
                ${cfg.columns.map((c) => `<th>${escapeHtml(c.label)}</th>`).join("")}

    function renderTableBody() {
        const cfg = TAB_CONFIGS[currentTab];
        const tbody = document.getElementById("dynamic-tbody");

        if (!currentRecords.length) {
            tbody.innerHTML = `<tr><td colspan="${cfg.columns.length + 2}" class="empty-row">ຍັງບໍ່ມີຂໍ້ມູນໃນໝວດນີ້ — ເພີ່ມຂໍ້ມູນໃໝ່ດ້ານເທິງໄດ້ເລີຍ</td></tr>`;

    window.switchScoreSubMode = function (mode) {
        currentScoreSubMode = mode === "annual" ? "annual" : "subject";
        document.getElementById("score-sub-btn-subject")?.classList.toggle("active", currentScoreSubMode === "subject");
        document.getElementById("score-sub-btn-annual")?.classList.toggle("active", currentScoreSubMode === "annual");
        renderFormFields();
        if (editingRecordId) {
            const target = currentRecords.find((r) => r.id === editingRecordId);
            if (target) populateScoreFormFromRecord(target);
        }
    };

    function populateScoreFormFromRecord(target) {
        const raw = target._raw || {};
        const subjSelect = document.getElementById("fld-subject");
        const activeSubj = cleanVal(subjSelect?.value) || availableSubjects[0];
        const cw = (raw.courseworkBySubject && raw.courseworkBySubject[activeSubj]) || raw.coursework || {};

        const setVal = (name, val) => {
            const el = document.getElementById("fld-" + name);
            if (el) el.value = val ?? "";
        };

        setVal("studentName", target.studentName);
        setVal("room", target.room);

        if (currentScoreSubMode === "subject") {
            setVal("subject", activeSubj);
            setVal("attendance", cw.attendance ?? 10);
            setVal("participation", cw.participation ?? 10);
            setVal("homework", cw.homework ?? 18);
            setVal("midterm", cw.midterm ?? 20);
            setVal("final", cw.final ?? 28);
        } else {
            setVal("totalCredits", raw.totalCredits ?? 24);
            setVal("earnedCredits", raw.earnedCredits ?? 24);
        }
    }

    async function loadTabData() {
        await refreshSubjectsFromFirestore();
        const cfg = TAB_CONFIGS[currentTab];
        document.querySelectorAll(".submenu-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.tab === currentTab);
        });
        document.getElementById("active-tab-title").textContent = cfg.title;
        document.getElementById("score-sub-bar").style.display = currentTab === "scores" ? "flex" : "none";

        renderFormFields();
        renderTableHeader();
        resetEditMode();

        const tbody = document.getElementById("dynamic-tbody");
        tbody.innerHTML = `<tr><td colspan="${cfg.columns.length + 2}" class="empty-row">ກຳລັງດຶງຂໍ້ມູນຈາກ Firebase...</td></tr>`;

        const merged = [];
        for (const colName of cfg.collections) {
            try {
                const snap = await getDocs(collection(db, colName));
                snap.forEach((docSnap) => {
                    const mapped = cfg.mapDoc(docSnap.data(), docSnap.id);
                    merged.push({ ...mapped, _col: colName });
                });
            } catch (err) {
                console.warn("ບໍ່ສາມາດອ່ານ collection " + colName, err);
            }
        }

        currentRecords = dedupeRecords(currentTab, merged);
        if (currentTab === "terms") {
            syncTermsCache(currentRecords);
        }
        renderTableBody();
    }

    window.switchUpdateTab = function (tabKey) {
        if (!TAB_CONFIGS[tabKey]) return;
        if (TAB_CONFIGS[tabKey].adminOnly && !isAdmin) {
            return alert("❌ ສະເພາະ Admin ເທົ່ານັ້ນທີ່ເຂົ້າໃຊ້ເມນູຈັດການເທີມຮຽນໄດ້!");
        }
        currentTab = tabKey;
        loadTabData();
    };

    window.startEditRecord = function (recordId, colName) {
        if (TAB_CONFIGS[currentTab]?.adminOnly && !isAdmin) {
            return alert("❌ ສະເພາະ Admin ເທົ່ານັ້ນ!");
        }
        const cfg = TAB_CONFIGS[currentTab];
        const target = currentRecords.find((r) => r.id === recordId && r._col === colName);
        if (!target) return;

        editingRecordId = recordId;
        editingCollectionName = colName || cfg.primaryCol;

        if (currentTab === "scores") {
            populateScoreFormFromRecord(target);
        } else {
            getActiveFields().forEach((f) => {
                const el = document.getElementById("fld-" + f.name);
                if (el) el.value = target[f.name] ?? (f.type === "select" ? (f.options?.[0] || "") : "");
            });
            if (currentTab === "tuition") {
                bindTuitionAutoCalculation();
            }
        }

        document.getElementById("form-heading").textContent = "✏️ ກຳລັງແກ້ໄຂຂໍ້ມູນ";
        document.getElementById("btn-submit-record").textContent = "💾 ບັນທຶກການແກ້ໄຂ";
        document.getElementById("btn-cancel-edit").style.display = "inline-block";
    };

        if (currentTab === "tuition") {

        document.getElementById("form-heading").textContent = "➕ ເພີ່ມຂໍ້ມູນໃໝ່";

    };

    window.deleteRecordItem = async function (recordId, colName) {
        if (TAB_CONFIGS[currentTab]?.adminOnly && !isAdmin) {
            return alert("❌ ສະເພາະ Admin ເທົ່ານັ້ນ!");
        }
        if (!confirm("ຕ້ອງການລົບຂໍ້ມູນລາຍການນີ້ແທ້ບໍ່?")) return;
        const cfg = TAB_CONFIGS[currentTab];
        const targetCol = colName || cfg.primaryCol;

        try {
            await deleteDoc(doc(db, targetCol, recordId));
            if (currentTab === "subjects") await refreshSubjectsFromFirestore();
            broadcastSystemDataUpdated(currentTab);
            await loadTabData();
            alert("🗑️ ລົບຂໍ້ມູນສຳເລັດ!");
        } catch (err) {
            alert("❌ ລົບຂໍ້ມູນບໍ່ສຳເລັດ: " + err.message);
        }
    };

    document.getElementById("dynamic-crud-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (TAB_CONFIGS[currentTab]?.adminOnly && !isAdmin) {
            return alert("❌ ສະເພາະ Admin ເທົ່ານັ້ນທີ່ເພີ່ມ, ແກ້ໄຂ ຫຼື ລົບເທີມຮຽນໄດ້!");
        }

        const cfg = TAB_CONFIGS[currentTab];
        const fields = getActiveFields();
        const formValues = {};

        fields.forEach((f) => {
            const el = document.getElementById("fld-" + f.name);
            formValues[f.name] = cleanVal(el ? el.value : "");
        });

        try {
            if (currentTab === "scores") {
                const studentName = formValues.studentName;
                const grade = cleanGrade(formValues.room) || "ມ.5";
                const existingRec = editingRecordId
                    ? currentRecords.find((r) => r.id === editingRecordId)
                    : currentRecords.find((r) =>
                        cleanVal(r.studentName).toLowerCase() === studentName.toLowerCase() &&
                        cleanGrade(r.room) === grade
                    );

                const prevRaw = existingRec?._raw || {};
                const docId = editingRecordId || existingRec?.id || ("STD-" + Date.now());
                const updatedCourseworkBySubject = { ...(prevRaw.courseworkBySubject || {}) };
                let totalCredits = prevRaw.totalCredits ?? 24;
                let earnedCredits = prevRaw.earnedCredits ?? 24;

                if (currentScoreSubMode === "subject") {
                    const subj = cleanVal(formValues.subject) || availableSubjects[0];
                    updatedCourseworkBySubject[subj] = {
                        attendance: boundNum(formValues.attendance, 0, 10, 0),
                        participation: boundNum(formValues.participation, 0, 10, 0),
                        homework: boundNum(formValues.homework, 0, 20, 0),
                        midterm: boundNum(formValues.midterm, 0, 25, 0),
                        final: boundNum(formValues.final, 0, 35, 0)
                    };
                } else {
                    totalCredits = boundNum(formValues.totalCredits, 0, 200, 24);
                    earnedCredits = boundNum(formValues.earnedCredits, 0, totalCredits, 24);
                }

                const merged = {
                    ...prevRaw,
                    id: prevRaw.id || docId,
                    firestoreId: docId,
                    name: studentName,
                    grade,
                    totalCredits,
                    earnedCredits,
                    courseworkBySubject: updatedCourseworkBySubject
                };
                const annualAvg = computeAnnualAverage(merged);
                const quarterScore = Number((annualAvg / 4).toFixed(2));

                await setDoc(doc(db, cfg.primaryCol, docId), {
                    ...merged,
                    annualAvg,
                    quarterScore,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                alert("✅ ບັນທຶກຄະແນນນັກຮຽນສຳເລັດແລ້ວ!");
            } else if (currentTab === "terms") {
                const term = formValues.term;
                const academicYear = formValues.academicYear || "2026-2027";
                const startMonth = cleanMonth(formValues.startMonth, "ກັນຍາ");
                const endMonth = cleanMonth(formValues.endMonth, "ມັງກອນ");
                const termRange = `${startMonth} – ${endMonth}`;
                const rawGrade = formValues.grade;
                const grade = (!rawGrade || rawGrade.toUpperCase() === "ALL") ? "ALL" : cleanGrade(rawGrade);
                const totalPeriods = Math.max(1, Number(formValues.totalPeriods) || 40);
                const maxScore = Math.max(1, Number(formValues.maxScore) || 20);

                const safeKey = `${academicYear}_${term}_${grade}`.replace(/[\/\\?#%]/g, "_").replace(/\s+/g, "_");
                const docId = editingRecordId || `TERM_${safeKey}`;

                const termPayload = {
                    id: docId,
                    firestoreId: docId,
                    term,
                    academicYear,
                    startMonth,
                    endMonth,
                    termRange,
                    grade,
                    totalPeriods,
                    maxScore,
                    updatedAt: serverTimestamp()
                };

                await setDoc(doc(db, cfg.primaryCol, docId), termPayload, { merge: true });
                alert(`✅ ບັນທຶກເທີມ "${term}" (${termRange}, ${totalPeriods} ຄາບ) ສຳເລັດແລ້ວ!`);
            } else {
                const payload = { ...formValues };

                if (currentTab === "rooms") {
                    payload.room = payload.name;
                    payload.grade = payload.name;
                } else if (currentTab === "teachers") {
                    payload.teacherName = payload.name;
                    payload.responsibility = payload.duty;
                    payload.rooms = payload.duty;
                    payload.room = payload.duty;
                } else if (currentTab === "students") {
                    payload.studentId = payload.studentCode;
                    payload.room = payload.grade;
                    payload.studentName = payload.name;
                    if (!payload.status) payload.status = "ກຳລັງຮຽນ";
                } else if (currentTab === "schedules") {
                    payload.day = cleanDay(payload.day);
                    payload.grade = payload.room;
                } else if (currentTab === "tuition") {
                    const credits = Math.max(0, Number(formValues.credits) || 0);
                    const pricePerCredit = Math.max(0, Number(formValues.pricePerCredit) || 0);
                    const tuitionFee = credits * pricePerCredit;

                    payload.studentId = cleanVal(formValues.studentId);
                    payload.studentName = cleanVal(formValues.studentName);
                    payload.name = payload.studentName;
                    payload.room = cleanGrade(formValues.room);
                    payload.grade = payload.room;
                    payload.term = cleanVal(formValues.term) || "ເທີມ 1 / 2026-2027";
                    payload.subject = cleanVal(formValues.subject);
                    payload.subjectName = payload.subject;
                    payload.item = `${payload.subject} (${payload.studentName})`;
                    payload.credits = credits;
                    payload.pricePerCredit = pricePerCredit;
                    payload.tuitionFee = tuitionFee;
                    payload.amount = `${formatNum(tuitionFee)} ກີບ`;
                    payload.status = cleanVal(formValues.status) || "ຄ້າງຈ່າຍ";
                } else if (currentTab === "subjects") {
                    payload.subjectName = payload.name;
                    payload.subject = payload.name;
                    payload.subjectCode = payload.code;
                }

                const candidateKey = getDedupKey(currentTab, { ...payload, _col: cfg.primaryCol, id: "" });
                const matchedExisting = !editingRecordId
                    ? currentRecords.find((r) => getDedupKey(currentTab, r) === candidateKey)
                    : null;

                if (editingRecordId || matchedExisting) {
                    const targetId = editingRecordId || matchedExisting.id;
                    const targetCol = editingCollectionName || matchedExisting?._col || cfg.primaryCol;
                    const prevRaw = matchedExisting?._raw || {};
                    await setDoc(doc(db, targetCol, targetId), {
                        ...prevRaw,
                        ...payload,
                        updatedAt: serverTimestamp()
                    }, { merge: true });

                    if (currentTab === "rooms") {
                        const mirrorId = "ROOM-" + cleanGrade(payload.name).replace(/[^\p{L}\p{N}_-]+/gu, "-") || targetId;
                        await setDoc(doc(db, "classrooms", mirrorId), {
                            id: mirrorId,
                            firestoreId: mirrorId,
                            name: payload.name,
                            advisor: payload.advisor,
                            phone: payload.phone,
                            building: payload.level,
                            studentCount: Number(payload.capacity || 0),
                            note: payload.note || "",
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    }
                    alert("✅ ອັບເດດຂໍ້ມູນ ສຳເລັດແລ້ວ!");
                } else {
                    const docRef = await addDoc(collection(db, cfg.primaryCol), {
                        ...payload,
                        createdAt: serverTimestamp()
                    });

                    if (currentTab === "rooms") {
                        const mirrorId = "ROOM-" + cleanGrade(payload.name).replace(/[^\p{L}\p{N}_-]+/gu, "-") || docRef.id;
                        await setDoc(doc(db, "classrooms", mirrorId), {
                            id: mirrorId,
                            firestoreId: mirrorId,
                            name: payload.name,
                            advisor: payload.advisor,
                            phone: payload.phone,
                            building: payload.level,
                            studentCount: Number(payload.capacity || 0),
                            note: payload.note || "",
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    }

                    if (currentTab === "students") {
                        const stdDocId = "STD-" + Date.now();
                        await setDoc(doc(db, "student_scores", stdDocId), {
                            id: payload.studentCode || stdDocId,
                            firestoreId: stdDocId,
                            name: payload.name,
                            grade: cleanGrade(payload.grade),
                            totalCredits: 24,
                            earnedCredits: 24,
                            coursework: { attendance: 10, participation: 10, homework: 18, midterm: 20, final: 28 },
                            annualAvg: 86,
                            quarterScore: 21.5,
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    }

                    alert("✅ ເພີ່ມຂໍ້ມູນໃໝ່ສຳເລັດ ແລະ ອັບເດດໄປທຸກໜ້າແລ້ວ!");
                }
            }

            broadcastSystemDataUpdated(currentTab);
            await loadTabData();
        } catch (err) {
            alert("❌ ບັນທຶກບໍ່ສຳເລັດ: " + err.message);
        }
    });

    if (userRole !== "student") {
        loadTabData();
    }
</script>
</body>
</html>
