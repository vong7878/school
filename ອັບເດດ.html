<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12. ຫ້ອງອັບເດດຂໍ້ມູນລະບົບ - 5. ຄະແນນນັກຮຽນ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Noto Sans Lao', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        h2 {
            margin: 0 0 14px;
            font-size: 18px;
            color: #f8fafc;
        }
        .sub-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .sub-tab-btn {
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 9px 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .sub-tab-btn.active {
            background: #2563eb;
            border-color: #60a5fa;
            color: #ffffff;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #cbd5e1;
        }
        input, select {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 11px;
            font-family: inherit;
            font-size: 13px;
        }
        button[type="submit"] {
            background: #16a34a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            opacity: 0.92;
        }
        .status-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #93c5fd;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="subroom-5-scores">
        <h2>5. ຄະແນນນັກຮຽນ</h2>

        <div class="sub-tabs">
            <button type="button" class="sub-tab-btn active" id="btn-score-sub-subject" onclick="switchUpdateScoreSub('subject')">
                1. ຄະແນນລາຍວິຊາ
            </button>
            <button type="button" class="sub-tab-btn" id="btn-score-sub-annual" onclick="switchUpdateScoreSub('annual')">
                2. ຄະແນນສະເລ່ຍໝົດປີ
            </button>
        </div>

        <!-- ຂໍ້ຍ່ອຍ 1: ຄະແນນລາຍວິຊາ -->
        <form id="form-score-subject" style="display:block;">
            <div class="form-grid">
                <div class="field">
                    <label for="upd-score-student-name">ຊື່ນັກຮຽນ</label>
                    <input type="text" id="upd-score-student-name" placeholder="ເຊັ່ນ ສົມໃຈ ໃຈດີ" required />
                </div>
                <div class="field">
                    <label for="upd-score-grade">ຫ້ອງ</label>
                    <input type="text" id="upd-score-grade" value="ມ.5" required />
                </div>
                <div class="field">
                    <label for="upd-score-subject">ວິຊາ</label>
                    <select id="upd-score-subject">
                        <option value="ຄະນິດສາດ">ຄະນິດສາດ</option>
                        <option value="ຟີຊິກສາດ">ຟີຊິກສາດ</option>
                        <option value="ເຄມີສາດ">ເຄມີສາດ</option>
                        <option value="ຊີວະສາດ">ຊີວະສາດ</option>
                        <option value="ພາສາລາວ">ພາສາລາວ</option>
                        <option value="ພາສາອັງກິດ">ພາສາອັງກິດ</option>
                        <option value="ໄອທີ / ຄອມ">ໄອທີ / ຄອມ</option>
                    </select>
                </div>
                <div class="field">
                    <label for="upd-cw-attendance">ຄະແນນການມາຮຽນ (0 - 10)</label>
                    <input type="number" id="upd-cw-attendance" min="0" max="10" step="0.5" value="10" required />
                </div>
                <div class="field">
                    <label for="upd-cw-participation">ຄະແນນການມີສ່ວນຮ່ວມ (0 - 10)</label>
                    <input type="number" id="upd-cw-participation" min="0" max="10" step="0.5" value="10" required />
                </div>
                <div class="field">
                    <label for="upd-cw-homework">ຄະແນນບົດເຝິກຫັດ (0 - 20)</label>
                    <input type="number" id="upd-cw-homework" min="0" max="20" step="0.5" value="18" required />
                </div>
                <div class="field">
                    <label for="upd-cw-midterm">ຄະແນນສອບເສັງກາງພາກ (0 - 25)</label>
                    <input type="number" id="upd-cw-midterm" min="0" max="25" step="0.5" value="20" required />
                </div>
                <div class="field">
                    <label for="upd-cw-final">ຄະແນນສອບເສັງທ້າຍພາກ (0 - 35)</label>
                    <input type="number" id="upd-cw-final" min="0" max="35" step="0.5" value="28" required />
                </div>
            </div>
            <button type="submit">💾 ບັນທຶກຄະແນນລາຍວິຊາ</button>
        </form>

        <!-- ຂໍ້ຍ່ອຍ 2: ຄະແນນສະເລ່ຍໝົດປີ -->
        <form id="form-score-annual" style="display:none;">
            <div class="form-grid">
                <div class="field">
                    <label for="upd-annual-student-name">ຊື່ນັກຮຽນ</label>
                    <input type="text" id="upd-annual-student-name" placeholder="ເຊັ່ນ ສົມໃຈ ໃຈດີ" required />
                </div>
                <div class="field">
                    <label for="upd-annual-grade">ຫ້ອງ</label>
                    <input type="text" id="upd-annual-grade" value="ມ.5" required />
                </div>
                <div class="field">
                    <label for="upd-total-credits">ໜ່ວຍກິດທັງໝົດ</label>
                    <input type="number" id="upd-total-credits" min="0" max="200" step="1" value="24" required />
                </div>
                <div class="field">
                    <label for="upd-earned-credits">ໜ່ວຍກິດສະສົມ (ຜ່ານ)</label>
                    <input type="number" id="upd-earned-credits" min="0" max="200" step="1" value="24" required />
                </div>
            </div>
            <button type="submit">💾 ບັນທຶກຄະແນນສະເລ່ຍໝົດປີ</button>
        </form>

        <div id="scoreUpdateStatus" class="status-msg"></div>
    </div>
</div>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
        getFirestore, collection, getDocs, setDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const DEFAULT_FIREBASE_CONFIG = {
        apiKey: "AIzaSyAZvZSKb9JQAWu6fbzbYxApudX3MwxRYss",
        authDomain: "my-school-c1104.firebaseapp.com",
        projectId: "my-school-c1104",
        storageBucket: "my-school-c1104.firebasestorage.app",
        messagingSenderId: "339930418459",
        appId: "1:339930418459:web:3dd86db9d280c6cb0cd7be",
        measurementId: "G-NPNFSW2C72"
    };

    const firebaseConfig = window.FIREBASE_CONFIG || DEFAULT_FIREBASE_CONFIG;
    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const SCORES_COLLECTION = "student_scores";
    const SUBJECTS = ["ຄະນິດສາດ", "ຟີຊິກສາດ", "ເຄມີສາດ", "ຊີວະສາດ", "ພາສາລາວ", "ພາສາອັງກິດ", "ໄອທີ / ຄອມ"];

    function cleanText(v) {
        return String(v ?? "").trim().replace(/^["']+|["']+$/g, "");
    }
    function cleanGrade(v) {
        return cleanText(v).replace(/\s+/g, "");
    }
    function boundNum(v, min, max, fallback = 0) {
        const n = Number(v);
        if (!Number.isFinite(n)) return fallback;
        return Math.max(min, Math.min(max, n));
    }
    function setStatus(msg) {
        const el = document.getElementById("scoreUpdateStatus");
        if (el) el.textContent = msg;
    }

    window.switchUpdateScoreSub = function (mode) {
        const isSubject = mode === "subject";
        document.getElementById("form-score-subject").style.display = isSubject ? "block" : "none";
        document.getElementById("form-score-annual").style.display = isSubject ? "none" : "block";
        document.getElementById("btn-score-sub-subject")?.classList.toggle("active", isSubject);
        document.getElementById("btn-score-sub-annual")?.classList.toggle("active", !isSubject);
    };

    async function findOrCreateStudentDoc(studentName, grade) {
        const cleanN = cleanText(studentName);
        const cleanG = cleanGrade(grade) || "ມ.5";
        const snap = await getDocs(collection(db, SCORES_COLLECTION));

        const existing = snap.docs.find((d) => {
            const data = d.data() || {};
            const sameName = cleanText(data.name).toLowerCase() === cleanN.toLowerCase();
            const sameGrade = cleanGrade(data.grade) === cleanG;
            return sameName && sameGrade;
        });

        if (existing) {
            return { docId: existing.id, data: existing.data() || {} };
        }

        const newId = "STD-" + Date.now();
        return {
            docId: newId,
            data: {
                id: newId,
                firestoreId: newId,
                name: cleanN,
                grade: cleanG,
                totalCredits: 24,
                earnedCredits: 24,
                coursework: { attendance: 8, participation: 8, homework: 15, midterm: 18, final: 25 },
                courseworkBySubject: {}
            }
        };
    }

    function computeAnnualAverage(data) {
        const map = data.courseworkBySubject || {};
        const totals = SUBJECTS.map((subj) => {
            const cw = map[subj] || data.coursework || {};
            return boundNum(cw.attendance, 0, 10, 8)
                + boundNum(cw.participation, 0, 10, 8)
                + boundNum(cw.homework, 0, 20, 15)
                + boundNum(cw.midterm, 0, 25, 18)
                + boundNum(cw.final, 0, 35, 25);
        });
        const avg = totals.reduce((a, b) => a + b, 0) / totals.length;
        return Number(avg.toFixed(1));
    }

    function notifyScoresUpdated(grade, studentName) {
        localStorage.setItem("schoolSystemDataUpdated", JSON.stringify({
            tab: "scores",
            grade,
            studentName,
            timestamp: Date.now()
        }));
        window.dispatchEvent(new Event("school-data-updated"));
    }

    // 1. ບັນທຶກຂໍ້ຍ່ອຍ: ຄະແນນລາຍວິຊາ
    document.getElementById("form-score-subject")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const studentName = cleanText(document.getElementById("upd-score-student-name").value);
        const grade = cleanGrade(document.getElementById("upd-score-grade").value) || "ມ.5";
        const subject = cleanText(document.getElementById("upd-score-subject").value);
        if (!studentName || !subject) return;

        const cwPayload = {
            attendance: boundNum(document.getElementById("upd-cw-attendance").value, 0, 10, 0),
            participation: boundNum(document.getElementById("upd-cw-participation").value, 0, 10, 0),
            homework: boundNum(document.getElementById("upd-cw-homework").value, 0, 20, 0),
            midterm: boundNum(document.getElementById("upd-cw-midterm").value, 0, 25, 0),
            final: boundNum(document.getElementById("upd-cw-final").value, 0, 35, 0)
        };

        try {
            const { docId, data } = await findOrCreateStudentDoc(studentName, grade);
            const updatedCourseworkBySubject = {
                ...(data.courseworkBySubject || {}),
                [subject]: cwPayload
            };
            const merged = {
                ...data,
                id: data.id || docId,
                firestoreId: docId,
                name: studentName,
                grade,
                courseworkBySubject: updatedCourseworkBySubject
            };
            const annualAvg = computeAnnualAverage(merged);
            const quarterScore = Number((annualAvg / 4).toFixed(2));

            await setDoc(doc(db, SCORES_COLLECTION, docId), {
                ...merged,
                annualAvg,
                quarterScore,
                updatedAt: serverTimestamp()
            }, { merge: true });

            notifyScoresUpdated(grade, studentName);
            setStatus(`✅ ບັນທຶກຄະແນນລາຍວິຊາ (${subject}) ຂອງ "${studentName}" ສຳເລັດ`);
            alert(`✅ ບັນທຶກຄະແນນລາຍວິຊາ (${subject}) ຂອງ "${studentName}" ສຳເລັດ!`);
        } catch (err) {
            setStatus("❌ ບັນທຶກບໍ່ສຳເລັດ: " + err.message);
            alert("❌ ບັນທຶກບໍ່ສຳເລັດ: " + err.message);
        }
    });

    // 2. ບັນທຶກຂໍ້ຍ່ອຍ: ຄະແນນສະເລ່ຍໝົດປີ
    document.getElementById("form-score-annual")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const studentName = cleanText(document.getElementById("upd-annual-student-name").value);
        const grade = cleanGrade(document.getElementById("upd-annual-grade").value) || "ມ.5";
        if (!studentName) return;

        const totalCredits = boundNum(document.getElementById("upd-total-credits").value, 0, 200, 24);
        const earnedCredits = boundNum(document.getElementById("upd-earned-credits").value, 0, totalCredits, 24);

        try {
            const { docId, data } = await findOrCreateStudentDoc(studentName, grade);
            const merged = {
                ...data,
                id: data.id || docId,
                firestoreId: docId,
                name: studentName,
                grade,
                totalCredits,
                earnedCredits
            };
            const annualAvg = computeAnnualAverage(merged);
            const quarterScore = Number((annualAvg / 4).toFixed(2));

            await setDoc(doc(db, SCORES_COLLECTION, docId), {
                ...merged,
                annualAvg,
                quarterScore,
                updatedAt: serverTimestamp()
            }, { merge: true });

            notifyScoresUpdated(grade, studentName);
            setStatus(`✅ ບັນທຶກຄະແນນສະເລ່ຍໝົດປີຂອງ "${studentName}" ສຳເລັດ (ສະເລ່ຍ: ${annualAvg}, 1 ໃນ 4: ${quarterScore})`);
            alert(`✅ ບັນທຶກຄະແນນສະເລ່ຍໝົດປີຂອງ "${studentName}" ສຳເລັດ!`);
        } catch (err) {
            setStatus("❌ ບັນທຶກບໍ່ສຳເລັດ: " + err.message);
            alert("❌ ບັນທຶກບໍ່ສຳເລັດ: " + err.message);
        }
    });
</script>
</body>
</html>
