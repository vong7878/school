<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ລາຍຊື່ຄູປະຈຳຫ້ອງ - ລະບົບຄຸ້ມຄອງໂຮງຮຽນ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Lao', sans-serif; }
        html, body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-width: 0;
            flex: 1 1 auto;
        }
        .back-btn {
            background: #334155;
            color: #f8fafc;
            text-decoration: none;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .back-btn:hover { background: #475569; }
        .page-title {
            font-size: clamp(15px, 2.2vw, 18px);
            font-weight: 700;
            color: #38bdf8;
            line-height: 1.35;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .user-pill {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            min-width: 0;
        }
        .user-pill > span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }
        .role-tag {
            background: #2563eb;
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 18px auto 32px;
            padding: 0 14px;
            min-width: 0;
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
            min-width: 0;
        }

        .panel-header {
            text-align: center;
            margin-bottom: 14px;
        }
        .panel-header h2 {
            color: #38bdf8;
            font-size: clamp(17px, 2.5vw, 22px);
            margin-bottom: 6px;
            line-height: 1.35;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px 13px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .badge-info {
            background: rgba(56, 189, 248, 0.14);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 5px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12.5px;
            white-space: nowrap;
        }

        .filter-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 9px 11px;
            margin-bottom: 14px;
        }
        .filter-group { min-width: 0; }
        .filter-group label {
            display: block;
            font-size: 11.5px;
            color: #94a3b8;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .filter-group input,
        .filter-group select {
            width: 100%;
            min-width: 0;
            padding: 6px 9px;
            border-radius: 7px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f8fafc;
            font-size: 12.5px;
        }
        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 620px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 10px 11px;
            text-align: left;
            font-size: 13px;
            line-height: 1.35;
        }
        th {
            background: #0f172a;
            font-weight: 700;
            color: #93c5fd;
            white-space: nowrap;
        }
        td {
            background: #162032;
            color: #f8fafc;
            overflow-wrap: anywhere;
        }
        th.center, td.center { text-align: center; }

        .source-tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.16);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #7dd3fc;
            margin-left: 6px;
            font-weight: 600;
        }
        .student-count-pill {
            display: inline-block;
            background: rgba(37, 99, 235, 0.22);
            border: 1px solid rgba(96, 165, 250, 0.45);
            color: #bfdbfe;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .container {
                margin: 12px auto 24px;
                padding: 0 10px;
            }
            .panel {
                padding: 12px;
                border-radius: 12px;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 12px;
            }
            .topbar-left, .user-pill {
                width: 100%;
            }
            .user-pill {
                justify-content: space-between;
                border-radius: 10px;
            }
            .user-pill > span:first-child {
                max-width: 210px;
            }
            .filter-bar {
                grid-template-columns: 1fr;
                gap: 7px;
                padding: 8px 9px;
            }
            table {
                min-width: 540px;
            }
            th, td {
                padding: 8px 8px;
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .page-title { font-size: 14px; }
            .back-btn { font-size: 11.5px; padding: 6px 9px; }
            .user-pill > span:first-child { max-width: 155px; }
        }

        /* ເຊື່ອງ badge / ປ້າຍສະຖານະ Firebase */
        #fbSyncBadge,
        .badge-fb,
        [data-hide-firebase="true"],
        [class*="firebase" i],
        [id*="firebase" i] {
            display: none !important;
        }
    </style>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="back-btn">← ກັບໜ້າຫຼັກ</a>
            <div class="page-title">👩‍🏫 ຜັງລາຍຊື່ຄູປະຈຳຫ້ອງ</div>
        </div>
        <div class="user-pill">
            <span>👤 <strong id="top-user-name">ຜູ້ໃຊ້ງານ</strong></span>
            <span class="role-tag" id="top-user-role">STUDENT</span>
        </div>
    </header>

    <div class="container">
        <section class="panel">
            <div class="panel-header">
                <h2>👩‍🏫 ຜັງລາຍຊື່ຄູປະຈຳຫ້ອງ (ຊັ້ນຮຽນຕ່າງໆ)</h2>
                <p class="subtitle" id="user-role-subtitle">ສະແດງສະເພາະຄູປະຈຳຫ້ອງທີ່ມີຂໍ້ມູນແທ້ ແລະ ຈຳນວນນັກຮຽນ</p>
            </div>

            <div class="top-bar">
                <span class="badge-info" id="room-total-count">ຈຳນວນລາຍການ: 0 ລາຍການ</span>
            </div>

            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filter-room-select">🏫 ກອງຕາມຊັ້ນ / ຫ້ອງຮຽນ:</label>
                    <select id="filter-room-select" onchange="renderCombinedView()">
                        <option value="">-- ທຸກຫ້ອງ --</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-search-input">🔍 ຄົ້ນຫາຊື່ຄູ / ຫ້ອງ / ເບີໂທ:</label>
                    <input type="text" id="filter-search-input" placeholder="ພິມຄຳຄົ້ນຫາ..." oninput="renderCombinedView()">
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="center" style="width: 68px;">ລຳດັບ</th>
                            <th class="center" style="width: 155px;">ຊັ້ນ / ຫ້ອງຮຽນ</th>
                            <th>ຊື່-ນາມສະກຸນ ຄູປະຈຳຫ້ອງ</th>
                            <th class="center" style="width: 145px;">ຈຳນວນນັກຮຽນ</th>
                            <th class="center" style="width: 145px;">ເບີໂທລະສັບ</th>
                        </tr>
                    </thead>
                    <tbody id="homeroom-table-body">
                        <tr><td colspan="5" class="center" style="padding: 20px;">ກຳລັງດຶງຂໍ້ມູນຈາກ Firebase...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore, collection, getDocs, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAZvZSKb9JQAWu6fbzbYxApudX3MwxRYss",
            authDomain: "my-school-c1104.firebaseapp.com",
            projectId: "my-school-c1104",
            storageBucket: "my-school-c1104.appspot.com",
            messagingSenderId: "339930418459",
            appId: "1:339930418459:web:3dd86db9d280c6cb0cd7be"
        };

        const firebaseConfig = window.FIREBASE_CONFIG || DEFAULT_FIREBASE_CONFIG;
        window.FIREBASE_CONFIG = firebaseConfig;

        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const HOMEROOM_COLLECTION = "homeroom_teachers";
        const ROOMS_COLLECTION = "rooms";
        const TEACHERS_COLLECTION = "teachers";
        const STUDENTS_COLLECTION = "students";
        const SYNC_STORAGE_KEY = "schoolSystemDataUpdated";
        const SYNC_EVENT_NAME = "school-data-updated";

        const PLACEHOLDER_TEACHER_NAMES = new Set([
            "",
            "-",
            "ຍັງບໍ່ໄດ້ລະບຸຄູປະຈຳຫ້ອງ",
            "ບໍ່ມີຄູປະຈຳຫ້ອງ",
            "ຍັງບໍ່ມີ"
        ]);

        function cleanVal(v) {
            return String(v ?? "").trim().replace(/^["']+|["']+$/g, "");
        }

        function cleanGrade(v) {
            return cleanVal(v).replace(/\s+/g, "");
        }

        function hasRealHomeroomTeacher(item) {
            const g = cleanGrade(item?.grade);
            const t = cleanVal(item?.teacherName);
            if (!g || g === "-") return false;
            if (PLACEHOLDER_TEACHER_NAMES.has(t.toLowerCase())) return false;
            return true;
        }

        function isHomeroomDutyText(dutyText) {
            const d = cleanVal(dutyText).toLowerCase();
            return d.includes("ປະຈຳຫ້ອງ") || d.includes("ປະຈຳຊັ້ນ") || d.includes("homeroom") || d.includes("advisor");
        }

        function getNormalizedRole() {
            const raw = cleanVal(
                localStorage.getItem("userRole") || localStorage.getItem("role") || "student"
            ).toLowerCase();
            if (["admin", "administrator", "ແອັດມິນ", "แอดมิน"].includes(raw)) return "admin";
            if (["teacher", "ຄູ", "ຄູອາຈານ", "ครู"].includes(raw)) return "teacher";
            return "student";
        }

        const userRole = getNormalizedRole();
        const userName = cleanVal(localStorage.getItem("userName")) || "User";

        let latestHomeroom = [];
        let latestRooms = [];
        let latestTeachers = [];
        let studentCountByGrade = new Map();

        function rebuildStudentCounts(studentDocs) {
            const counts = new Map();
            const seenStudents = new Set();

            for (const docSnap of studentDocs) {
                const d = docSnap.data() || {};
                const grade = cleanGrade(d.grade || d.room || d.classRoom || "");
                if (!grade) continue;

                const code = cleanVal(d.studentCode || d.studentId || d.code || "").toLowerCase();
                const name = cleanVal(d.name || d.studentName || "").replace(/\s+/g, " ").toLowerCase();
                const dedupKey = code ? `code:${code}` : (name ? `ng:${name}__${grade.toLowerCase()}` : `doc:${docSnap.id}`);

                if (seenStudents.has(dedupKey)) continue;
                seenStudents.add(dedupKey);

                const gKey = grade.toLowerCase();
                counts.set(gKey, (counts.get(gKey) || 0) + 1);
            }

            studentCountByGrade = counts;
        }

        function mapHomeroomDoc(docSnap) {
            const d = docSnap.data() || {};
            const gradeVal = cleanGrade(d.grade || d.room || d.name || "");
            const teacherVal = cleanVal(d.teacherName || d.advisor || d.name || "");
            const phoneVal = cleanVal(d.phone || d.email || "-");
            const orderVal = Number(d.order) || 99;
            const capVal = Number(d.capacity ?? d.studentCount ?? 0);
            return {
                docId: docSnap.id,
                sourceLabel: "",
                grade: gradeVal,
                room: gradeVal,
                teacherName: teacherVal,
                phone: phoneVal || "-",
                fallbackCount: Number.isFinite(capVal) && capVal > 0 ? capVal : 0,
                order: orderVal
            };
        }

        function mapRoomDoc(docSnap) {
            const d = docSnap.data() || {};
            const gradeVal = cleanGrade(d.name || d.roomName || d.room || d.grade || "");
            const teacherVal = cleanVal(d.advisor || d.homeroomTeacher || d.teacherName || "");
            const phoneVal = cleanVal(d.phone || d.tel || d.contact || "-");
            const capVal = Number(d.capacity ?? d.studentCount ?? 0);
            return {
                docId: docSnap.id,
                sourceLabel: "ຫ້ອງ",
                grade: gradeVal,
                room: gradeVal,
                teacherName: teacherVal,
                phone: phoneVal || "-",
                fallbackCount: Number.isFinite(capVal) && capVal > 0 ? capVal : 0,
                order: 99
            };
        }

        function mapTeacherDoc(docSnap) {
            const d = docSnap.data() || {};
            const dutyVal = cleanVal(d.duty || d.responsibility || "");
            const rawGrade = cleanGrade(d.room || d.grade || d.rooms || "");
            const matchedGradeMatch = dutyVal.match(/(ມ\.\d+(?:\/\d+)?)/i);
            const gradeVal = rawGrade || (matchedGradeMatch ? cleanGrade(matchedGradeMatch[1]) : "");
            const teacherVal = cleanVal(d.name || d.teacherName || "");
            const subjVal = cleanVal(d.subject || d.major || "");
            const phoneVal = cleanVal(d.phone || d.email || "-");
            const isAdvisor = Boolean(gradeVal) && (isHomeroomDutyText(dutyVal) || Boolean(d.room || d.grade || d.rooms));

            return {
                docId: docSnap.id,
                sourceLabel: subjVal ? `ຄູ • ${subjVal}` : "ຄູ",
                grade: isAdvisor ? gradeVal : "",
                room: isAdvisor ? gradeVal : "",
                teacherName: isAdvisor ? teacherVal : "",
                phone: phoneVal || "-",
                fallbackCount: 0,
                order: 99
            };
        }

        function mergeRecords(homeroomList, roomList, teacherList) {
            const merged = [];
            const gradeMap = new Map();

            const validHomeroom = homeroomList.filter(hasRealHomeroomTeacher);
            for (const hr of validHomeroom) {
                const gKey = cleanGrade(hr.grade).toLowerCase();
                const entry = { ...hr };
                merged.push(entry);
                if (!gradeMap.has(gKey)) gradeMap.set(gKey, entry);
            }

            const validRooms = roomList.filter(hasRealHomeroomTeacher);
            for (const rm of validRooms) {
                const gKey = cleanGrade(rm.grade).toLowerCase();
                if (!gradeMap.has(gKey)) {
                    const entry = { ...rm };
                    merged.push(entry);
                    gradeMap.set(gKey, entry);
                } else {
                    const target = gradeMap.get(gKey);
                    if ((!target.phone || target.phone === "-") && rm.phone && rm.phone !== "-") {
                        target.phone = rm.phone;
                    }
                    if (!target.fallbackCount && rm.fallbackCount) {
                        target.fallbackCount = rm.fallbackCount;
                    }
                }
            }

            const validTeachers = teacherList.filter(hasRealHomeroomTeacher);
            for (const tc of validTeachers) {
                const gKey = cleanGrade(tc.grade).toLowerCase();
                if (!gradeMap.has(gKey)) {
                    const entry = { ...tc };
                    merged.push(entry);
                    gradeMap.set(gKey, entry);
                } else {
                    const target = gradeMap.get(gKey);
                    if ((!target.phone || target.phone === "-") && tc.phone && tc.phone !== "-") {
                        target.phone = tc.phone;
                    }
                }
            }

            return merged.map((item) => {
                const gKey = cleanGrade(item.grade).toLowerCase();
                const liveCount = gKey ? studentCountByGrade.get(gKey) : undefined;
                const studentCount = liveCount !== undefined ? liveCount : (item.fallbackCount || 0);
                return { ...item, studentCount };
            });
        }

        function refreshRoomFilterOptions(allItems) {
            const selectEl = document.getElementById("filter-room-select");
            if (!selectEl) return;

            const prevVal = cleanGrade(selectEl.value).toLowerCase();
            const uniqueRooms = new Map();

            for (const item of allItems) {
                const g = cleanGrade(item.grade);
                if (!g || g === "-") continue;
                const key = g.toLowerCase();
                if (!uniqueRooms.has(key)) {
                    uniqueRooms.set(key, g);
                }
            }

            const sortedRooms = Array.from(uniqueRooms.values()).sort((a, b) => a.localeCompare(b));
            selectEl.innerHTML =
                `<option value="">-- ທຸກຫ້ອງ --</option>` +
                sortedRooms.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join("");

            if (prevVal) {
                const matched = Array.from(selectEl.options).find((o) => cleanGrade(o.value).toLowerCase() === prevVal);
                if (matched) selectEl.value = matched.value;
            }
        }

        window.renderCombinedView = function () {
            const allList = mergeRecords(latestHomeroom, latestRooms, latestTeachers);
            allList.sort((a, b) => (a.order || 99) - (b.order || 99) || String(a.grade).localeCompare(String(b.grade)));
            refreshRoomFilterOptions(allList);

            const roomFilter = cleanGrade(document.getElementById("filter-room-select")?.value || "").toLowerCase();
            const searchKw = cleanVal(document.getElementById("filter-search-input")?.value || "").toLowerCase();

            const filteredList = allList.filter((item) => {
                const gClean = cleanGrade(item.grade).toLowerCase();
                const matchesRoom = !roomFilter || gClean === roomFilter;
                const matchesSearch = !searchKw ||
                    String(item.grade || "").toLowerCase().includes(searchKw) ||
                    String(item.teacherName || "").toLowerCase().includes(searchKw) ||
                    String(item.phone || "").toLowerCase().includes(searchKw) ||
                    String(item.sourceLabel || "").toLowerCase().includes(searchKw);
                return matchesRoom && matchesSearch;
            });

            const tbody = document.getElementById("homeroom-table-body");
            const totalBadge = document.getElementById("room-total-count");
            totalBadge.innerText = `ຈຳນວນລາຍການ: ${filteredList.length} / ${allList.length} ລາຍການ`;

            if (filteredList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="center" style="padding: 20px; color: #94a3b8;">ບໍ່ມີຂໍ້ມູນຄູປະຈຳຫ້ອງ</td></tr>`;
                return;
            }

            let html = '';
            filteredList.forEach((item, idx) => {
                const tagHtml = item.sourceLabel ? `<span class="source-tag">${esc(item.sourceLabel)}</span>` : "";

                html += `
                    <tr>
                        <td class="center">${idx + 1}</td>
                        <td class="center"><strong>${esc(item.grade)}</strong></td>
                        <td>${esc(item.teacherName)}${tagHtml}</td>
                        <td class="center"><span class="student-count-pill">${esc(String(item.studentCount ?? 0))} ຄົນ</span></td>
                        <td class="center">${esc(item.phone || '-')}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        };

        window.loadHomeroomTeachers = async function () {
            const tbody = document.getElementById("homeroom-table-body");
            tbody.innerHTML = `<tr><td colspan="5" class="center" style="padding: 20px;">ກຳລັງດຶງຂໍ້ມູນຈາກ Firebase...</td></tr>`;

            try {
                try {
                    const homeroomSnap = await getDocs(collection(db, HOMEROOM_COLLECTION));
                    latestHomeroom = homeroomSnap.docs.map((docSnap) => mapHomeroomDoc(docSnap));
                } catch (e) {
                    latestHomeroom = [];
                }

                try {
                    const roomSnap = await getDocs(collection(db, ROOMS_COLLECTION));
                    latestRooms = roomSnap.docs.map((docSnap) => mapRoomDoc(docSnap));
                } catch (e) {
                    latestRooms = [];
                }

                try {
                    const teacherSnap = await getDocs(collection(db, TEACHERS_COLLECTION));
                    latestTeachers = teacherSnap.docs.map((docSnap) => mapTeacherDoc(docSnap));
                } catch (e) {
                    latestTeachers = [];
                }

                try {
                    const studentSnap = await getDocs(collection(db, STUDENTS_COLLECTION));
                    rebuildStudentCounts(studentSnap.docs);
                } catch (e) {
                    studentCountByGrade = new Map();
                }

                renderCombinedView();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" class="center" style="padding: 20px; color: #fca5a5;">ເກີດຂໍ້ຜິດພາດໃນການໂຫຼດຂໍ້ມູນ: ${esc(err.message)}</td></tr>`;
            }
        };

        function esc(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        onSnapshot(collection(db, HOMEROOM_COLLECTION), (snap) => {
            latestHomeroom = snap.docs.map((docSnap) => mapHomeroomDoc(docSnap));
            renderCombinedView();
        }, () => {});

        onSnapshot(collection(db, ROOMS_COLLECTION), (snap) => {
            latestRooms = snap.docs.map((docSnap) => mapRoomDoc(docSnap));
            renderCombinedView();
        }, () => {});

        onSnapshot(collection(db, TEACHERS_COLLECTION), (snap) => {
            latestTeachers = snap.docs.map((docSnap) => mapTeacherDoc(docSnap));
            renderCombinedView();
        }, () => {});

        onSnapshot(collection(db, STUDENTS_COLLECTION), (snap) => {
            rebuildStudentCounts(snap.docs);
            renderCombinedView();
        }, () => {});

        window.addEventListener("storage", (e) => {
            if (e.key === SYNC_STORAGE_KEY) loadHomeroomTeachers();
        });
        window.addEventListener(SYNC_EVENT_NAME, () => loadHomeroomTeachers());

        window.addEventListener("DOMContentLoaded", async () => {
            document.getElementById("top-user-name").innerText = userName;
            document.getElementById("top-user-role").innerText = userRole.toUpperCase();
            document.getElementById("user-role-subtitle").innerText = `ຜູ້ໃຊ້ງານ: ${userName} (${userRole.toUpperCase()})`;

            await loadHomeroomTeachers();
        });
    </script>
</body>
</html>
