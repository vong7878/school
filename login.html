<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ເຂົ້າສູ່ລະບົບ - School Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            font-family: 'Noto Sans Lao', 'Phetsarath OT', Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 14px;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 100%;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-text-size-adjust: 100%;
        }
        .login-card {
            background: #ffffff;
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            min-width: 0;
        }
        h2 {
            text-align: center;
            color: #1e293b;
            margin: 0 0 18px;
            font-size: clamp(18px, 5vw, 22px);
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .form-group {
            margin-bottom: 14px;
            min-width: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 13.5px;
        }
        input {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            background: #ffffff;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
        }
        button {
            width: 100%;
            max-width: 100%;
            padding: 11px 14px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button:hover:not(:disabled) {
            background: #1d4ed8;
        }
        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .error-msg {
            color: #dc2626;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
        .quota-note {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 14px;
            display: none;
            overflow-wrap: anywhere;
        }
        .quota-note.show {
            display: block;
        }

        @media (max-width: 420px) {
            html, body {
                padding: 10px;
            }
            .login-card {
                padding: 18px 14px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 ເຂົ້າສູ່ລະບົບໂຮງຮຽນ</h2>

        <div class="quota-note" id="quotaNote">
            ⚠️ ໂຄຕ້າປະຈຳມື້ຂອງ Firebase ອາດຈະເຕັມ — ລະບົບຈະກວດສອບຈາກບັນຊີທີ່ເກັບໃນເຄື່ອງ (`localStorage`) ຖ້າມີ.
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">ອີເມວ (Email):</label>
                <input type="email" id="login-email" required autocomplete="email" placeholder="example@school.com">
            </div>
            <div class="form-group">
                <label for="login-password">ລະຫັດຜ່ານ (Password):</label>
                <input type="password" id="login-password" required autocomplete="current-password" placeholder="********">
            </div>
            <button type="submit" id="loginSubmitBtn">ເຂົ້າສູ່ລະບົບ</button>
            <div id="login-error" class="error-msg"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZvZSKb9JQAWu6fbzbYxApudX3MwxRYss",
            authDomain: "my-school-c1104.firebaseapp.com",
            projectId: "my-school-c1104",
            storageBucket: "my-school-c1104.firebasestorage.app",
            messagingSenderId: "339930418459",
            appId: "1:339930418459:web:3dd86db9d280c6cb0cd7be",
            measurementId: "G-NPNFSW2C72"
        };

        let db = null;
        try {
            const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {}

        const QUOTA_BLOCK_UNTIL_KEY = "school_firestore_quota_blocked_until";
        const KNOWN_ACCOUNTS_KEY = "school_known_login_accounts";
        const LOGIN_COOLDOWN_MS = 2000;
        const QUOTA_COOLDOWN_MS = 1800000;

        function stripQuotes(val) {
            return String(val || "")
                .trim()
                .replace(/^["']+|["']+$/g, "");
        }

        function isQuotaError(err) {
            const code = String(err?.code || "").toLowerCase();
            const msg = String(err?.message || "").toLowerCase();
            return (
                code.includes("resource-exhausted") ||
                msg.includes("quota") ||
                msg.includes("resource exhausted") ||
                msg.includes("daily usage")
            );
        }

        function setQuotaNote(active) {
            const el = document.getElementById("quotaNote");
            if (!el) return;
            if (active) el.classList.add("show");
            else el.classList.remove("show");
        }

        function loadKnownAccounts() {
            try {
                const list = JSON.parse(localStorage.getItem(KNOWN_ACCOUNTS_KEY) || "[]");
                return Array.isArray(list) ? list : [];
            } catch (e) {
                return [];
            }
        }

        function saveKnownAccount(account) {
            try {
                const list = loadKnownAccounts();
                const idx = list.findIndex((a) => String(a.email || "").toLowerCase() === String(account.email || "").toLowerCase());
                if (idx >= 0) {
                    list[idx] = { ...list[idx], ...account };
                } else {
                    list.push(account);
                }
                localStorage.setItem(KNOWN_ACCOUNTS_KEY, JSON.stringify(list.slice(-30)));
            } catch (e) {}
        }

        function matchUserDoc(data, emailLower, password, defaultRole) {
            if (!data) return null;
            const cleanEmail = stripQuotes(data.email).toLowerCase();
            const cleanPass = stripQuotes(data.password);

            if (cleanEmail === emailLower && cleanPass === password) {
                return {
                    ...data,
                    email: cleanEmail,
                    password: cleanPass,
                    role: stripQuotes(data.role || defaultRole).toLowerCase(),
                    grade: stripQuotes(data.grade || data.room || data.classRoom || "ມ.5"),
                    name: stripQuotes(data.name || "User")
                };
            }
            return null;
        }

        function finishLogin(userData, fallbackEmail) {
            const roleValue = userData.role || "user";
            const gradeValue = userData.grade || "ມ.5";
            const nameValue = userData.name || "User";
            const emailValue = userData.email || fallbackEmail;

            saveKnownAccount({
                email: emailValue,
                password: userData.password || "",
                role: roleValue,
                grade: gradeValue,
                name: nameValue
            });

            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userEmail", emailValue);
            localStorage.setItem("userRole", roleValue);
            localStorage.setItem("role", roleValue);
            localStorage.setItem("userGrade", gradeValue);
            localStorage.setItem("userName", nameValue);

            alert(`✅ ເຂົ້າສູ່ລະບົບສຳເລັດ! ຍິນດີຕ້ອນຮັບ (${roleValue.toUpperCase()})`);
            window.location.href = "index.html";
        }

        if (Date.now() < Number(localStorage.getItem(QUOTA_BLOCK_UNTIL_KEY) || "0")) {
            setQuotaNote(true);
        }

        let lastSubmitTs = 0;

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const now = Date.now();
            if (now - lastSubmitTs < LOGIN_COOLDOWN_MS) return;
            lastSubmitTs = now;

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const emailLower = email.toLowerCase();
            const errorDiv = document.getElementById("login-error");
            const submitBtn = document.getElementById("loginSubmitBtn");

            errorDiv.innerText = "ກຳລັງກວດສອບຂໍ້ມູນ...";
            if (submitBtn) submitBtn.disabled = true;

            try {
                let userData = null;
                const blockedUntil = Number(localStorage.getItem(QUOTA_BLOCK_UNTIL_KEY) || "0");

                if (db && Date.now() >= blockedUntil) {
                    const collectionsToCheck = [
                        { name: "users", defaultRole: "student" },
                        { name: "teachers", defaultRole: "teacher" },
                        { name: "students", defaultRole: "student" }
                    ];

                    for (const colInfo of collectionsToCheck) {
                        if (userData) break;
                        const snap = await getDocs(collection(db, colInfo.name));
                        snap.forEach((doc) => {
                            if (!userData) {
                                const matched = matchUserDoc(doc.data(), emailLower, password, colInfo.defaultRole);
                                if (matched) userData = matched;
                            }
                        });
                    }

                    if (userData) {
                        localStorage.removeItem(QUOTA_BLOCK_UNTIL_KEY);
                        setQuotaNote(false);
                    }
                } else {
                    setQuotaNote(true);
                }

                if (!userData) {
                    const localMatch = loadKnownAccounts().find((acc) => matchUserDoc(acc, emailLower, password, acc.role || "student"));
                    if (localMatch) {
                        userData = localMatch;
                    }
                }

                if (!userData) {
                    errorDiv.innerText = "❌ ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ!";
                    return;
                }

                finishLogin(userData, email);
            } catch (error) {
                if (isQuotaError(error)) {
                    localStorage.setItem(QUOTA_BLOCK_UNTIL_KEY, String(Date.now() + QUOTA_COOLDOWN_MS));
                    setQuotaNote(true);
                    const localMatch = loadKnownAccounts().find((acc) => matchUserDoc(acc, emailLower, password, acc.role || "student"));
                    if (localMatch) {
                        finishLogin(localMatch, email);
                        return;
                    }
                    errorDiv.innerText = "⚠️ ໂຄຕ້າ Firebase ປະຈຳມື້ເຕັມ ແລະ ບໍ່ພົບບັນຊີໃນເຄື່ອງ.";
                } else {
                    const localMatch = loadKnownAccounts().find((acc) => matchUserDoc(acc, emailLower, password, acc.role || "student"));
                    if (localMatch) {
                        finishLogin(localMatch, email);
                        return;
                    }
                    errorDiv.innerText = "❌ ເກີດຂໍ້ຜິດພາດໃນການເຊື່ອມຕໍ່: " + error.message;
                }
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
